spring.application.name=stock

#Conexion a MySQL. La base de datos se crea sola si no existe.
#Se pueden cambiar con variables de entorno: DB_HOST, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:stock_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

#Crea y actualiza las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
#Poner a true para ver los queries en consola
spring.jpa.show-sql=false
#adapta SQL a la BD
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Abre el navegador automaticamente al arrancar
app.abrir-navegador=true
